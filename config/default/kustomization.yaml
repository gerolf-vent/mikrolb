---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../crd
  - ../rbac
  - ../certmanager
  - ../controller
  - ../webhook

labels:
  - pairs:
      app.kubernetes.io/name: mikrolb
    includeSelectors: true
  - pairs:
      app.kubernetes.io/version: v0.1.2

images:
  - name: ghcr.io/gerolf-vent/mikrolb-controller
    newTag: 0.1.2
